name: Deploy Next.js Web to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate Base Path & Target Dir
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base_path=/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
            echo "dest_dir=" >> $GITHUB_OUTPUT
          else
            # Clean branch name for URL safety (replace slash with hyphen)
            CLEAN_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "base_path=/${{ github.event.repository.name }}/previews/${CLEAN_NAME}" >> $GITHUB_OUTPUT
            echo "dest_dir=previews/${CLEAN_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Build Next.js Static Web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.config.outputs.base_path }}
        run: |
          cd web
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          destination_dir: ${{ steps.config.outputs.dest_dir }}
          keep_files: true

